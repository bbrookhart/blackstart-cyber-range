[project]
name = "blackstart"
version = "0.1.0"
description = "A consequence-driven cyber-physical resilience range for critical infrastructure under compromise."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Brian Brookhart" }]
keywords = ["ics", "ot", "cyber-physical", "resilience", "consequence-driven", "research"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Topic :: Scientific/Engineering",
]

dependencies = [
  "pydantic>=2.9,<3",
  "pyyaml>=6.0,<7",
  "networkx>=3.3,<4",
  "matplotlib>=3.10,<4",
]

[project.optional-dependencies]
services = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "httpx>=0.27,<1",
]

[project.scripts]
blackstart = "blackstart.cli.main:main"

[project.urls]
Homepage = "https://github.com/bbrookhart/blackstart-cyber-range"
Repository = "https://github.com/bbrookhart/blackstart-cyber-range"

[dependency-groups]
dev = [
  "pytest>=9.0.3,<10",
  "pytest-cov>=5.0,<7",
  "hypothesis>=6.112,<7",
  "mypy>=1.11,<2",
  "ruff>=0.7,<1",
  "pre-commit>=4.0,<5",
  "types-PyYAML>=6.0,<7",
  "pip-audit>=2.7,<3",
  "cyclonedx-bom>=5.1,<8",
  "httpx>=0.27,<1",
  "httpx2>=2.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["blackstart"]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["blackstart", "services", "tests"]

[tool.ruff.lint]
select = [
  "E", "W",    # pycodestyle
  "F",         # pyflakes
  "I",         # isort
  "N",         # pep8-naming
  "UP",        # pyupgrade
  "B",         # bugbear
  "A",         # builtins shadowing
  "C4",        # comprehensions
  "SIM",       # simplify
  "PTH",       # pathlib
  "RUF",       # ruff-specific
  "ANN",       # annotations
  "S",         # bandit (security)
  "D",         # pydocstyle
]
ignore = [
  "D203",   # conflicts with D211
  "D213",   # conflicts with D212
  "ANN401", # allow typing.Any in narrow, documented cases
]

[tool.ruff.lint.per-file-ignores]
# Tests: asserts are the point; terse docstrings are fine; and S311 fires on
# every seeded simulation RNG, which is exactly what these tests must use.
"tests/**" = ["D", "S101", "S311", "ANN"]
"services/**" = ["D104"]
"blackstart/analysis/plots.py" = ["E501"]
"blackstart/experiment/flagship.py" = ["E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_unused_ignores = true
disallow_any_generics = true
plugins = ["pydantic.mypy"]
files = ["blackstart", "services", "tests"]

[[tool.mypy.overrides]]
module = ["networkx.*", "cyclonedx.*"]
ignore_missing_imports = true

# Tests are type-checked, but pytest test functions and fixtures are not
# required to carry full annotations: the value of typing them is low and the
# noise is high. Everything they call is strictly typed.
[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_decorators = false
disallow_any_decorated = false

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
  "unit: fast, isolated unit tests",
  "property: Hypothesis property-based tests",
  "integration: end-to-end scenario/evidence pipeline tests",
  "architecture: deployment-topology and exposure tests",
]
filterwarnings = ["error"]

# ---------------------------------------------------------------------------
# Coverage
#
# Branch coverage is enforced against the safety-critical core only. See
# docs/reviewer-guide.md for why repository-wide coverage is not the gate.
# ---------------------------------------------------------------------------
[tool.coverage.run]
branch = true
source = ["blackstart"]
omit = ["blackstart/cli/*"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "@overload",
]
show_missing = true
