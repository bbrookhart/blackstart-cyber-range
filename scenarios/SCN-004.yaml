# BLACKSTART scenario SCN-004  --  FLAGSHIP
id: "SCN-004"
name: "Unauthorised setpoint mutation"
category: "cyber-effect"
seed: 4242
duration_s: 1200.0

research_question: >-
  Given that an adversary has achieved unauthorised control influence, which
  engineered constraint prevents that influence from becoming an unacceptable
  physical consequence?

description: >-
  The supervisory level setpoint is changed to a value above the safe working
  level by something other than legitimate operator action. The controller is
  functioning perfectly: it faithfully pursues the setpoint it was given. The
  instrumentation is honest. Every digital component behaves exactly as designed.

  The process still ends up outside its safe envelope, because nothing in the
  control path is responsible for deciding whether a setpoint is a sensible one.

  This is the flagship experiment. It is run twice under identical configuration
  and seed, differing in exactly one respect: whether the independent engineering
  constraint EBS-001 is present. The measured difference between the two runs is
  the project's central result.

  Note what is NOT modelled. BLACKSTART does not simulate how the setpoint came
  to be changed -- no authentication is bypassed, no protocol frame is crafted,
  no flaw is exploited. The scenario assumes the influence and measures the
  consequence. Whether such influence is achievable against any real system is
  not a question this range can answer.

events:
  - t_s: 180.0
    effect: "setpoint.override"
    description: >-
      Level setpoint mutated from 3.20 m to 4.80 m, above the INV-001 safe
      working level of 4.50 m.
    params:
      value_m: 4.80
    attack_ics: ["T0836", "T0831"]

notes: >-
  Mapped to T0836 (Modify Parameter) and T0831 (Manipulation of Control) at the
  level of EFFECT. T0880 (Loss of Safety) is deliberately NOT mapped: that
  technique concerns loss of safety systems or mechanisms, whereas this scenario
  produces an unsafe process state with the safety instrumentation intact and
  reporting correctly. Mapping it would be an association based on the word
  "safety" rather than on the technique's meaning.

# Measured outcomes, populated from actual experiment runs and asserted by
# tests/integration/test_scenario_expectations.py. A divergence means either the
# implementation regressed or the design intent was wrong; both need
# investigation rather than an updated number.
expected:
  backstop_disabled:
    maximum_consequence: "C4"
    violated_invariants: ["INV-001", "INV-004"]
    service_availability_pct_min: 46.0
    service_availability_pct_max: 47.5
  backstop_enabled:
    maximum_consequence: "C1"
    violated_invariants: ["INV-004"]
    service_availability_pct_min: 99.9
    service_availability_pct_max: 100.0
